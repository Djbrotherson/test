name: Build Lighthouse H700 v6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bullseye
    timeout-minutes: 240

    steps:
      - name: Install base build tools
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git ninja-build pkg-config \
            python3 python3-pip ca-certificates curl xz-utils \
            libsdl2-dev libpng-dev libzip-dev \
            zipcmp zipmerge ziptool \
            libspdlog-dev libfmt-dev libboost-dev \
            libglvnd-dev libgl-dev libglew-dev libglfw3-dev \
            nlohmann-json3-dev \
            patchelf zip file binutils

          python3 -m pip install --no-cache-dir --upgrade "pip<24.1"
          python3 -m pip install --no-cache-dir "cmake==3.31.6"

          hash -r
          cmake --version | tee cmake-version.txt
          ninja --version | tee ninja-version.txt

      - name: Build dependency packages with CMake metadata
        shell: bash
        run: |
          set -euxo pipefail

          PREFIX=/usr/local
          COMMON_FLAGS="-O2 -DNDEBUG -march=armv8-a -mcpu=cortex-a53 -mtune=cortex-a53 -mno-outline-atomics"

          # TinyXML2
          git clone --depth 1 --branch 9.0.0 \
            https://github.com/leethomason/tinyxml2.git tinyxml2-source
          cmake -S tinyxml2-source -B tinyxml2-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_C_FLAGS_RELEASE="$COMMON_FLAGS" \
            -DCMAKE_CXX_FLAGS_RELEASE="$COMMON_FLAGS" \
            -DBUILD_SHARED_LIBS=ON \
            -Dtinyxml2_BUILD_TESTING=OFF
          cmake --build tinyxml2-build --parallel "$(nproc)"
          cmake --install tinyxml2-build

          # libogg
          git clone --depth 1 --branch v1.3.5 \
            https://github.com/xiph/ogg.git ogg-source
          cmake -S ogg-source -B ogg-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_C_FLAGS_RELEASE="$COMMON_FLAGS" \
            -DBUILD_SHARED_LIBS=ON \
            -DINSTALL_DOCS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build ogg-build --parallel "$(nproc)"
          cmake --install ogg-build

          # libvorbis
          git clone --depth 1 --branch v1.3.7 \
            https://github.com/xiph/vorbis.git vorbis-source
          cmake -S vorbis-source -B vorbis-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_C_FLAGS_RELEASE="$COMMON_FLAGS" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF
          cmake --build vorbis-build --parallel "$(nproc)"
          cmake --install vorbis-build

          # SDL2_net
          git clone --depth 1 --branch release-2.2.0 \
            https://github.com/libsdl-org/SDL_net.git sdl2-net-source
          cmake -S sdl2-net-source -B sdl2-net-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DCMAKE_C_FLAGS_RELEASE="$COMMON_FLAGS" \
            -DSDL2NET_SAMPLES=OFF \
            -DSDL2NET_TESTS=OFF \
            -DSDL2NET_INSTALL=ON \
            -DBUILD_SHARED_LIBS=ON
          cmake --build sdl2-net-build --parallel "$(nproc)"
          cmake --install sdl2-net-build

          ldconfig

          find /usr/local \
            \( -iname '*tinyxml2*' -o -iname '*SDL2_net*' -o \
               -iname '*ogg*Config.cmake' -o -iname '*vorbis*Config.cmake' \) \
            -print | sort | tee dependency-cmake-files.txt

      - name: Download exact Lighthouse source
        shell: bash
        run: |
          set -euxo pipefail

          git clone https://github.com/HarbourMasters/Lighthouse.git source
          cd source
          git checkout 4423e0c1a10e70c42301bce2a5fb969964cf3537
          git submodule sync --recursive
          git submodule update --init --recursive --force
          git submodule status --recursive | tee ../submodules.txt

      - name: Configure Lighthouse for Cortex-A53
        shell: bash
        run: |
          set -o pipefail

          export CMAKE_PREFIX_PATH="/usr/local"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib/aarch64-linux-gnu/pkgconfig:/usr/local/share/pkgconfig"

          cmake -S source -B source/build-h700 -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -march=armv8-a -mcpu=cortex-a53 -mtune=cortex-a53 -mno-outline-atomics" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -march=armv8-a -mcpu=cortex-a53 -mtune=cortex-a53 -mno-outline-atomics" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--as-needed" \
            2>&1 | tee configure.log

      - name: Compile Lighthouse
        shell: bash
        run: |
          set -o pipefail

          cmake --build source/build-h700 --parallel "$(nproc)" 2>&1 | tee build.log

          test -x source/build-h700/Lighthouse
          file source/build-h700/Lighthouse | tee binary-file.txt

      - name: Package muOS runtime
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p package/lighthouse/libs
          install -m 755 source/build-h700/Lighthouse package/lighthouse/Lighthouse

          ldd source/build-h700/Lighthouse | tee ldd-full.txt

          awk '/=> \// {print $3} /^\// {print $1}' ldd-full.txt \
            | sort -u > runtime-libraries.txt

          while IFS= read -r lib; do
            [ -n "$lib" ] || continue

            case "$(basename "$lib")" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|\
              ld-linux-aarch64.so.*|libgcc_s.so.*)
                ;;
              *)
                cp -L "$lib" package/lighthouse/libs/
                ;;
            esac
          done < runtime-libraries.txt

          patchelf --set-rpath '$ORIGIN/libs' package/lighthouse/Lighthouse

          test -f package/lighthouse/libs/libOpenGL.so.0

          readelf --version-info package/lighthouse/Lighthouse > elf-versions.txt
          readelf -d package/lighthouse/Lighthouse > elf-dynamic.txt
          find package -maxdepth 3 -type f -printf '%p\n' | sort > package-files.txt

          cd package
          zip -9 -r ../Lighthouse-H700-muOS.zip lighthouse

      - name: Upload finished port files
        uses: actions/upload-artifact@v4
        with:
          name: Lighthouse-H700-muOS-v6
          path: Lighthouse-H700-muOS.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lighthouse-H700-v6-diagnostics
          path: |
            cmake-version.txt
            ninja-version.txt
            dependency-cmake-files.txt
            submodules.txt
            configure.log
            build.log
            binary-file.txt
            ldd-full.txt
            runtime-libraries.txt
            elf-versions.txt
            elf-dynamic.txt
            package-files.txt
            source/build-h700/CMakeCache.txt
            source/build-h700/CMakeFiles/CMakeOutput.log
            source/build-h700/CMakeFiles/CMakeError.log
          if-no-files-found: warn
          retention-days: 30
