name: Build Lighthouse for H700 (muOS-compatible)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Build inside Debian Bullseye ARM64
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"

          docker run --rm \
            --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE/out:/out" \
            debian:bullseye \
            bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential git cmake ninja-build pkg-config python3 ca-certificates \
                libsdl2-dev libsdl2-net-dev libpng-dev libzip-dev \
                libtinyxml2-dev libspdlog-dev libfmt-dev \
                libboost-dev libglvnd-dev libopengl-dev libgl-dev \
                libglew-dev libglfw3-dev libogg-dev libvorbis-dev \
                nlohmann-json3-dev patchelf zip file binutils

              git clone --recurse-submodules https://github.com/HarbourMasters/Lighthouse.git /src
              cd /src
              git checkout 4423e0c1a10e70c42301bce2a5fb969964cf3537
              git submodule sync --recursive
              git submodule update --init --recursive --force

              cmake -S . -B build-h700 -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -march=armv8-a -mcpu=cortex-a53 -mtune=cortex-a53 -mno-outline-atomics" \
                -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -march=armv8-a -mcpu=cortex-a53 -mtune=cortex-a53 -mno-outline-atomics" \
                -DCMAKE_EXE_LINKER_FLAGS="-Wl,--as-needed"

              cmake --build build-h700 --parallel "$(nproc)"
              test -x build-h700/Lighthouse

              mkdir -p /package/lighthouse/libs
              install -m 755 build-h700/Lighthouse /package/lighthouse/Lighthouse

              # Bundle non-glibc runtime libraries, including libOpenGL.so.0.
              ldd build-h700/Lighthouse | awk '\''/=> \\// { print $3 } /^\\// { print $1 }'\'' | sort -u > /tmp/libs.txt
              while IFS= read -r lib; do
                case "$(basename "$lib")" in
                  libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|ld-linux-aarch64.so.*)
                    ;;
                  *)
                    cp -L "$lib" /package/lighthouse/libs/
                    ;;
                esac
              done < /tmp/libs.txt

              patchelf --set-rpath '\''$ORIGIN/libs'\'' /package/lighthouse/Lighthouse

              file /package/lighthouse/Lighthouse
              readelf --version-info /package/lighthouse/Lighthouse | grep -o "GLIBC_[0-9.]*" | sort -Vu | tail || true
              test -f /package/lighthouse/libs/libOpenGL.so.0

              cd /package
              zip -9 -r /out/Lighthouse-H700-muOS-compatible.zip lighthouse
            '

      - name: Upload completed port files
        uses: actions/upload-artifact@v4
        with:
          name: Lighthouse-H700-muOS-compatible
          path: out/Lighthouse-H700-muOS-compatible.zip
          if-no-files-found: error
          retention-days: 30
